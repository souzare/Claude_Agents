mcs.metadata:
  componentName: Encaminhar
  description: |-
    Este tópico do sistema é disparado quando o usuário indica que quer falar com um representante.
    Você pode configurar como o agente lidará com cenários de entrega humana nas configurações do agente.
    Se o seu agente não fizer escalonamentos, esse tópico deverá ser desabilitado.
